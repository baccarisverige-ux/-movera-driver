name: Restore Driver Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .restore2/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo "1ed8e5f17a50fc2902dfe56d105fa5043526b66140faa3b503f90a998ff7c3ea  /tmp/source.tar.xz" | sha256sum -c -
          xz -t /tmp/source.tar.xz
          tar -xJf /tmp/source.tar.xz
          test -f pubspec.yaml
          test -f lib/main.dart
      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .restore2 .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/flutter-web.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Movera Driver source"
          git push
