name: Diagnose Driver Analysis
on:
  push:
    branches:
      - canonical-architecture-2026
    paths:
      - .github/workflows/debug-analysis.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration locally
        run: python3 tools/canonicalize.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture analyzer output
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analysis.log
      - uses: actions/upload-artifact@v4
        with:
          name: driver-analysis-diagnostics
          path: analysis.log
          retention-days: 1
